{% extends 'base_dashboard.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center mb-4">Carica un'immagine nella Galleria</h2>
            <form method="POST" enctype="multipart/form-data">
                {{ form.hidden_tag() }}
                <div class="form-group">
                    <label for="images">Seleziona Immagini</label>
                    <input type="file" id="images" name="images" class="form-control-file" multiple required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">Carica</button>
            </form>
        </div>
    </div>
</div>
<script>
    document.querySelector('form').addEventListener('submit', function() {
        console.log("Form inviato!");
        console.log(document.getElementById('images').files);
    });
</script>
{% endblock %}
