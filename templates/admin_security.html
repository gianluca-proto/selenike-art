{% extends 'base_dashboard.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Gestione della Sicurezza</h2>
    <form method="POST">
        <div class="form-group">
            <label for="password">Nuova Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Inserisci nuova password">
        </div>
        <div class="form-group">
            <label for="permissions">Permessi Utente</label>
            <select class="form-control" id="permissions" name="permissions">
                <option value="admin">Amministratore</option>
                <option value="user">Utente</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Aggiorna Impostazioni</button>
    </form>
</div>
{% endblock %}
