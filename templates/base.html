<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selenike Art</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.7.2/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>
<body>
    <!-- Top bar with social media icons -->
 <div class="container-fluid bg-light py-2">
        <div class="row justify-content-center">

            <div class="col-md-4 text-left">
                <a href="https://www.facebook.com/selenikeart" class="social-icon"><i class="bi bi-facebook"></i></a>
                <a href="https://www.instagram.com/selenikeart" class="social-icon"><i class="bi bi-instagram"></i></a>
                <a href="https://www.patreon.com/selenikeart" class="social-icon"><i class="bi bi-patreon"></i></a>
            </div>
            <div class="col-md-4 text-center">
                <img src="{{ url_for('static', filename='img/LogoSito.png') }}" alt="Selenike Art" class="logo-img">
            </div>
            <div class="col-md-4">
                <!-- Vuoto per ora -->
            </div>
        </div>
    </div>

    <!-- Centered Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light justify-content-center">
        <div class="navbar-collapse collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/">Homepage</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/art-gallery">Art Gallery</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/commissions">Commissions</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/about">Selenike</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/contact">Contattaci</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

      <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <div class="container">
            <p>&copy; 2024 Selenike Art. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
