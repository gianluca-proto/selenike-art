<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selenike Art</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.7.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/ekko-lightbox/5.3.0/ekko-lightbox.css" rel="stylesheet">

    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
    <style>
        .whatsapp-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 50%;
            padding: 15px;
            font-size: 24px;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .gallery-filter {
            margin-bottom: 20px;
        }

        .gallery-filter button {
            margin-right: 10px;
        }

        .gallery-item {
            display: none;
        }

        .gallery-item.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Top bar with social media icons -->

        <div class="row justify-content-center">
            <div class="col-md-4 text-left">
                <a href="https://www.facebook.com/selenikeart" class="social-icon"><i class="bi bi-facebook"></i></a>
                <a href="https://www.instagram.com/selenikeart" class="social-icon"><i class="bi bi-instagram"></i></a>
                <a href="https://www.patreon.com/selenikeart" class="social-icon"><i class="bi bi-patreon"></i></a>
            </div>
            <div class="col-md-4 text-center">
                <img src="{{ url_for('static', filename='img/LogoSito.png') }}" alt="Selenike Art" class="logo-img">
            </div>
            <div class="col-md-4">
                <!-- Vuoto per ora -->
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light w-100">
        <div class="container-fluid px-0  justify-content-center">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav lobster-font-menu">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Homepage</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/art-gallery">Art Gallery</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/commissions">Commissions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">Selenike</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/contact">Contattaci</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-0">
        {% block content %}{% endblock %}
    </div>

    <!-- WhatsApp Button -->
    <a href="https://wa.me/1234567890" class="whatsapp-button" target="_blank">
        <i class="bi bi-whatsapp"></i>
    </a>

    <!-- Footer -->
    <footer class="text-white py-4 w-100 mt-4">
        <div class="container">
            <div class="row">
                <!-- Logo -->
                <div class="col-md-4 text-center mb-3 mb-md-0">
                    <img src="{{ url_for('static', filename='img/LogoSito.png') }}" alt="Selenike Art" class="logo-img" style="max-width: 200px;">
                </div>
                <!-- Info -->
                <div class="col-md-4 text-center text-md-left mb-3 mb-md-0">
                    <h5>Info:</h5>
                    <ul class="list-unstyled">
                        <li><a href="/contact" class="text-white">Contattaci</a></li>
                        <li><a href="/about" class="text-white">Selenike</a></li>
                        <li><a href="/privacy-policy" class="text-white">Privacy Policy</a></li>
                        <li class="text-white">PARTITA IVA 13490680967</li>
                    </ul>
                </div>
                <!-- Social -->
                <div class="col-md-4 text-center text-md-right">
                    <h5>Social:</h5>
                    <ul class="list-unstyled">
                        <li><a href="https://www.facebook.com/selenikeart" class="text-white"><i class="bi bi-facebook"></i> Facebook</a></li>
                        <li><a href="https://www.instagram.com/selenikeart" class="text-white"><i class="bi bi-instagram"></i> Instagram</a></li>
                        <li><a href="https://www.patreon.com/selenikeart" class="text-white"><i class="bi bi-patreon"></i> Patreon</a></li>
                        <li><a href="https://www.twitter.com/selenikeart" class="text-white"><i class="bi bi-twitter"></i> Twitter</a></li>
                        <li><a href="https://www.threads.net/selenikeart" class="text-white"><i class="bi bi-threads"></i> Threads</a></li>
                    </ul>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col text-center">
                    <p class="mb-0 text-white">Managed by Gianluca Proto.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ekko-lightbox/5.3.0/ekko-lightbox.min.js"></script>
    <script>
        $(document).on('click', '[data-toggle="lightbox"]', function(event) {
            event.preventDefault();
            $(this).ekkoLightbox();
        });

        // Disabilitare il tasto destro del mouse
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        }, false);

        // Prevenire il drag and drop delle immagini
        $('img').on('dragstart', function(event) { event.preventDefault(); });
    </script>
    <script>
        function filterGallery(category) {
            var items = document.getElementsByClassName('gallery-item');
            console.log('Filtering for category:', category);
            if (category === 'all') {
                for (var i = 0; i < items.length; i++) {
                    items[i].classList.add('show');
                }
            } else {
                for (var i = 0; i < items.length; i++) {
                    items[i].classList.remove('show');
                    if (items[i].classList.contains(category)) {
                        items[i].classList.add('show');
                    }
                }
            }
        }

        filterGallery('all'); // Show all items by default
    </script>
</body>
</html>
