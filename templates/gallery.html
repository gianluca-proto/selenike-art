{% extends 'base.html' %}
{% block content %}
<div class="container my-4">
    <h1 class="text-center mb-4">Art Gallery</h1>
    <div class="row">
        {% for image in images %}
        <div class="col-md-3 mb-4">
            <a href="{{ url_for('static', filename='img/gallery/' ~ image) }}" data-toggle="lightbox" data-gallery="gallery" class="col-md-4">
                <img src="{{ url_for('static', filename='img/gallery/' ~ image) }}" class="img-fluid rounded">
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
